<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOSS 岗位追踪台 · 演示</title>
<style>
  :root { --line: #ebebeb; --muted: #8a8a8a; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 400 14px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #1a1a1a;
    background: #f5f5f3;
  }
  header {
    background: #fff;
    border-bottom: 1px solid var(--line);
    padding: 14px 28px;
    display: flex;
    align-items: center;
    gap: 14px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header b { font-size: 16px; font-weight: 500; }
  header .tag {
    font-size: 11px; color: #854F0B; background: #FAEEDA;
    padding: 2px 8px; border-radius: 5px;
  }
  header .hint { margin-left: auto; font-size: 12.5px; color: var(--muted); }
  main { max-width: 880px; margin: 0 auto; padding: 22px 20px 80px; }
  .toolbar { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
  ul.job-list-box { list-style: none; margin: 0; padding: 0; }
  li.job-card-wrapper {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 10px;
  }
  .job-top { display: flex; align-items: baseline; gap: 12px; }
  .job-name { font-size: 15px; font-weight: 500; color: #1a1a1a; text-decoration: none; }
  .job-name:hover { color: #0F6E56; }
  .salary { margin-left: auto; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; color: #D85A30; }
  .job-meta { margin-top: 6px; font-size: 12.5px; color: var(--muted); }
  ul.tag-list { list-style: none; display: flex; gap: 6px; margin: 9px 0 0; padding: 0; flex-wrap: wrap; }
  ul.tag-list li { font-size: 11.5px; color: #5F5E5A; background: #F7F7F5; border-radius: 5px; padding: 2px 8px; }
  h3.company-name { margin: 12px 0 0; font-size: 13px; font-weight: 400; }
  h3.company-name a { color: #444; text-decoration: none; }
  h3.company-name a:hover { color: #0F6E56; }
  .note {
    max-width: 880px; margin: 18px auto 0; padding: 0 20px;
    font-size: 12.5px; color: var(--muted); line-height: 1.9;
  }
</style>
</head>
<body>

<header>
  <b>BOSS 直聘</b>
  <span class="tag">演示页 · 模拟数据</span>
  <span class="hint">右下角悬浮球点开即为追踪台</span>
</header>

<main>
  <div class="toolbar">杭州 · 人力资源 · 共 8 个职位（均为模拟数据）</div>
  <ul class="job-list-box" id="job-list"></ul>
</main>

<div class="note">
  这是一个纯静态演示页，不连接任何真实数据。<br>
  它干了两件事：预置一份模拟存储，然后加载真实的用户脚本，让你不装 Tampermonkey 也能看到界面。<br>
  脚本在这种环境下会自动回退到 <code>localStorage</code>，行为和装在浏览器里一致。
</div>

<script>
(function () {
  var HOUR = 3600 * 1000;
  var DAY = 24 * HOUR;
  var now = Date.now();

  var jobs = [
    { id: 'j1', title: '招聘专员', company: '某某科技有限公司', salary: '8-12K', area: '杭州·西湖区', tags: ['1-3年', '本科'], status: 'applied',   firstSeen: now - 2 * HOUR, platformTime: '3小时前' },
    { id: 'j2', title: 'HRBP（实习可转正）', company: '某某科技有限公司', salary: '150元/天', area: '杭州·余杭区', tags: ['在校/应届', '本科'], status: 'todo',    firstSeen: now - 3 * HOUR, platformTime: '5小时前' },
    { id: 'j3', title: '组织发展经理', company: '某某科技有限公司', salary: '20-35K', area: '杭州·上城区', tags: ['5-10年', '硕士'], status: 'interview', firstSeen: now - 1 * DAY,  platformTime: '昨天' },
    { id: 'j4', title: '校园招聘项目助理', company: '甲乙数据', salary: '6-8K', area: '北京·朝阳区', tags: ['在校/应届', '本科'], status: 'pending',  firstSeen: now - 2 * DAY,  platformTime: '2天前' },
    { id: 'j5', title: '人力资源实习生', company: '甲乙数据', salary: '200元/天', area: '北京·海淀区', tags: ['在校/应届'], status: 'todo',  firstSeen: now - 4 * HOUR, platformTime: '4小时前' },
    { id: 'j6', title: '培训主管', company: '丙丙网络', salary: '12-18K', area: '上海·浦东新区', tags: ['3-5年', '本科'], status: 'chat',   firstSeen: now - 3 * DAY,  platformTime: '3天前' },
    { id: 'j7', title: '薪酬绩效专员', company: '丙丙网络', salary: '9-14K', area: '上海·徐汇区', tags: ['1-3年', '本科'], status: 'closed',  firstSeen: now - 8 * DAY,  platformTime: '' },
    { id: 'j8', title: '招聘实习生', company: '丁丁集团', salary: '180元/天', area: '杭州·滨江区', tags: ['经验不限'], status: 'applied', firstSeen: now - 10 * DAY, platformTime: '' }
  ];

  var state = {
    version: 1,
    companies: [
      { id: 'c1', name: '某某科技', aliases: ['某某科技有限公司'], group: '', priority: 3 },
      { id: 'c2', name: '甲乙数据', aliases: [], group: '', priority: 3 },
      { id: 'c3', name: '丙丙网络', aliases: [], group: '', priority: 3 },
      { id: 'c4', name: '丁丁集团', aliases: [], group: '', priority: 3 }
    ],
    jobs: {},
    settings: {
      keywords: ['HRBP', '招聘', '人力资源', '组织发展', '校招', '培训'],
      onlyTracked: true,
      autoCollect: true
    }
  };

  jobs.forEach(function (j) {
    var hay = (j.title + ' ' + j.tags.join(' ')).toLowerCase();
    state.jobs[j.id] = {
      id: j.id,
      title: j.title,
      company: j.company,
      companyId: '',
      salary: j.salary,
      area: j.area,
      tags: j.tags,
      link: 'https://www.zhipin.com/',
      platformTime: j.platformTime,
      firstSeen: j.firstSeen,
      lastSeen: now,
      status: j.status,
      note: '',
      starred: state.settings.keywords.some(function (k) { return hay.indexOf(k.toLowerCase()) !== -1; })
    };
  });

  try {
    localStorage.setItem('bossTracker_state_v1', JSON.stringify(state));
  } catch (e) { /* 忽略 */ }

  var list = document.getElementById('job-list');
  var html = jobs.map(function (j) {
    return '<li class="job-card-wrapper">' +
      '<div class="job-top">' +
        '<a class="job-name" href="/job_detail/' + j.id + '.html" onclick="return false">' + j.title + '</a>' +
        '<span class="salary">' + j.salary + '</span>' +
      '</div>' +
      '<div class="job-meta">' + j.area + '</div>' +
      '<ul class="tag-list">' +
        j.tags.map(function (t) { return '<li>' + t + '</li>'; }).join('') +
        '<li>' + j.platformTime + '</li>' +
      '</ul>' +
      '<h3 class="company-name"><a href="#">' + j.company + '</a></h3>' +
      '</li>';
  }).join('');
  list.innerHTML = html;

  var s = document.createElement('script');
  s.src = '../boss-job-tracker.user.js';
  s.onload = function () {
    setTimeout(function () {
      var orb = document.getElementById('bt-orb');
      if (orb) orb.click();
    }, 400);
  };
  document.body.appendChild(s);
})();
</script>

</body>
</html>
